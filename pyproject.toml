[project]
name = "bitclaw"
version = "0.1.0"
description = "Slack ↔ Claude agent orchestrator backed by Bitrise Remote Dev Environments (reference implementation)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Bitrise Ltd." }]
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.21",
    "aiohttp>=3.9",
    "claude-agent-sdk>=0.2.110",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/bitrise-io/bitclaw-public"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.14",
]

[tool.ruff.lint.per-file-ignores]
# Logging must be fully configured before app modules are imported.
"main.py" = ["E402"]

# This is an application run from its checkout (`uv run python main.py`),
# not an installable package — tell uv not to build/install it.
[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The app is not an installed package (see [tool.uv] above) — put the repo
# root on sys.path so tests import the top-level modules directly.
pythonpath = ["."]
